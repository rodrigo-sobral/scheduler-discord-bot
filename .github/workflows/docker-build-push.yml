name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config/**'
      - 'assets/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:                             # User-facing prompt when triggering manually
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}  # Deny all permissions by default at workflow level

jobs:
  check-changes:
    name: Check for relevant code changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.src_prisma_scripts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history to compare branches

      - name: Check for changes in src, prisma, or scripts
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            src_prisma_scripts:
              - 'src/**'
              - 'prisma/**'
              - 'scripts/**'

  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Lint code 🧹
        run: uvx ruff check . --fix --exit-zero

      - name: Test code 🧪
        run: |
          uv run prisma generate && \
          uv run pytest

  version-bump:
    name: Bump version
    runs-on: ubuntu-latest
    needs: [check-changes, ci]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write  # Required to commit and push the version tag
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false   # Must be true to push the commit and tag back
          fetch-depth: 0              # Full history required by bump2version

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install bump2version 🔖
        run: pip install bump2version

      - name: Bump ${{ inputs.bump_type }} version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          bump2version ${BUMP_TYPE}
          # Read the new version written by bump2version into .bumpversion.cfg
          NEW_VERSION=$(grep "^current_version" .bumpversion.cfg | sed 's/current_version = //')
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Push commit and tag 🚀
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${REF_NAME}" --follow-tags --atomic

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: version-bump
    if: github.event_name == 'workflow_dispatch' && needs.version-bump.outputs.new_version != ''
    permissions:
      contents: write # Required to create a release and upload assets (if any)
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate release notes
        id: gen
        env:
          NEW_TAG: ${{ needs.version-bump.outputs.new_version }}
        run: |
          git fetch --tags
          if [ -z "$NEW_TAG" ]; then
            echo "No new version available" >&2
            exit 1
          fi
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^$NEW_TAG$" | sed -n '1p' || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="$NEW_TAG"
          fi
          COMMITS=$(git log $RANGE --pretty=format:'- %h %s (%an)')
          if [ -z "$COMMITS" ]; then
            COMMITS="No commits found."
          fi
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.gen.outputs.tag }}
          name: ${{ steps.gen.outputs.tag }}
          body: ${{ steps.gen.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: [check-changes, ci, version-bump]  # version-bump is skipped on push/PR — skipped ≠ failed, so this still runs
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read   # Required to read the code for building the Docker image
      packages: write  # Required to push the Docker image to the registry

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            # Semver tag — only populated when version-bump ran and output a version
            type=raw,value=${{ needs.version-bump.outputs.new_version }},enable=${{ needs.version-bump.outputs.new_version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64,linux/amd64

  notify:
    needs: [check-changes, build-and-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Image build status
        env:
          RESULT: ${{ needs.build-and-push.result }}
        run: |
          echo "Docker image build completed with status: ${RESULT}"
