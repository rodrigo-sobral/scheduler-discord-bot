name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'config/**'
      - 'assets/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: Lint, test and detect changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.src_prisma_scripts }}
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for changes in src, prisma, or scripts
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && github.ref || '' }}
          filters: |
            src_prisma_scripts:
              - 'src/**'
              - 'prisma/**'
              - 'scripts/**'

      - name: Install uv
        if: steps.filter.outputs.src_prisma_scripts == 'true' || github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Lint code 🧹
        if: steps.filter.outputs.src_prisma_scripts == 'true' || github.event_name == 'workflow_dispatch'
        run: uvx ruff check . --fix --exit-zero

      - name: Test code 🧪
        if: steps.filter.outputs.src_prisma_scripts == 'true' || github.event_name == 'workflow_dispatch'
        run: uv run prisma generate && uv run pytest

  version-bump-and-release:
    name: Bump version and create release
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # Required to push commits and tags
      actions: write # Required to upload artifacts
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Bump ${{ inputs.bump_type }} version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uvx bump2version ${BUMP_TYPE}

          TAG=$(git describe --tags --exact-match)
          VERSION=$(echo "$TAG" | sed 's/^v//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag 🚀
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${REF_NAME}" --follow-tags --atomic

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD" || RANGE="HEAD"
          git log "$RANGE" --pretty=format:"- %B" > /tmp/release_body.md

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: /tmp/release_body.md

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [ci, version-bump-and-release]
    # version-bump-and-release is skipped on push/PR — skipped ≠ failed, so this still runs
    if: |
      always() &&
      needs.ci.result == 'success' &&
      (needs.ci.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write # Required to create a release and upload assets (if any)
      packages: write # Required to push images
      actions: read # Required to download artifacts
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download release notes
        if: needs.version-bump-and-release.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: /tmp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ needs.version-bump-and-release.outputs.version }},enable=${{ needs.version-bump-and-release.outputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64,linux/amd64

      - name: Create Release
        if: needs.version-bump-and-release.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version-bump-and-release.outputs.tag }}" \
            --title "${{ needs.version-bump-and-release.outputs.tag }}" \
            --notes-file /tmp/release_body.md

  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Image build status
        env:
          RESULT: ${{ needs.build-and-push.result }}
        run: |
          echo "Docker image build completed with status: ${RESULT}"
