name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config/**'
      - 'assets/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:                             # User-facing prompt when triggering manually
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}  # Deny all permissions by default at workflow level

jobs:
  check-changes:
    name: Check for relevant code changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.src_prisma_scripts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history to compare branches

      - name: Check for changes in src, prisma, or scripts
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            src_prisma_scripts:
              - 'src/**'
              - 'prisma/**'
              - 'scripts/**'

  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Lint code 🧹
        run: uvx ruff check . --fix --exit-zero

      - name: Test code 🧪
        run: |
          uv run prisma generate && \
          uv run pytest

  version-bump:
    name: Bump version
    runs-on: ubuntu-latest
    needs: [check-changes, ci]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write  # Required to commit and push the version tag
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false   # Must be true to push the commit and tag back
          fetch-depth: 0              # Full history required by bump2version

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install bump2version 🔖
        run: pip install bump2version

      - name: Bump ${{ inputs.bump_type }} version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          bump2version ${BUMP_TYPE}
          # Read the new version written by bump2version into .bumpversion.cfg
          NEW_VERSION=$(grep "^current_version" .bumpversion.cfg | sed 's/current_version = //')
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Push commit and tag 🚀
        env:
          WORKFLOW_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git remote set-url origin "https://x-access-token:${WORKFLOW_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "${REF_NAME}" --tags --atomic

  build-and-push:
    runs-on: ubuntu-latest
    needs: [check-changes, ci, version-bump]  # version-bump is skipped on push/PR — skipped ≠ failed, so this still runs
    if: needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read   # Required to read the code for building the Docker image
      packages: write  # Required to push the Docker image to the registry

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Semver tag — only populated when version-bump ran and output a version
            type=raw,value=${{ needs.version-bump.outputs.new_version }},enable=${{ needs.version-bump.outputs.new_version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/arm64,linux/amd64

  notify:
    needs: [check-changes, build-and-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Image build status
        env:
          RESULT: ${{ needs.build-and-push.result }}
        run: |
          echo "Docker image build completed with status: ${RESULT}"
