[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scheduler-discord-bot"
version = "1.0.0"
description = "Discord bot that schedules messages to users and channels at specific times"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Scheduler Bot", email = "scheduler@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.0",
    "prisma>=0.15.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.13.5",
    "anyio>=3.7.1",
    "async-timeout>=4.0.1",
    "pydantic>=2.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=7.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "C4", "B", "A"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
