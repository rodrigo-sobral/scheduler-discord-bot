[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scheduler-discord-bot"
version = "0.0.2"
description = "Discord bot that schedules messages to users and channels at specific times"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Scheduler Bot", email = "scheduler@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.0",
    "prisma>=0.15.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.13.5",
    "anyio>=3.7.1",
    "async-timeout>=4.0.1",
    "pydantic>=2.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=7.4.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "ASYNC",   # flake8-async
    "B",       # flake8-bugbear
    "DTZ",     # flake8-datetimez
    "E",       # pycodestyle errors
    "F",       # Pyflakes
    "G",       # flake8-logging-format
    "I",       # isort
    "LOG",     # flake8-logging
    "PIE",     # flake8-pie
    "PLE",     # Pylint errors
    "PLR",     # Pylint refactor
    "PLW",     # Pylint warnings
    "RET",     # flake8-return
    "RUF",     # Ruff-specific
    "SIM",     # flake8-simplify
    "UP",      # pyupgrade
    "W",       # pycodestyle warnings
    "YTT",     # flake8-2020
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
